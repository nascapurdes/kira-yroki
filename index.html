<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8059cf"><title>Академия открытий</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#34234f;background:#f6efff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e9ddff,#fff1e3 65%,#dff7ef);min-height:100vh}button,input{font:inherit}button{cursor:pointer}main{max-width:720px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;font-size:21px}.pill{background:white;border-radius:30px;padding:9px 14px;box-shadow:0 5px 18px #7655aa22;font-weight:800}.hero{margin:22px 0;background:linear-gradient(120deg,#8862df,#d577bc);color:white;border-radius:28px;padding:24px;position:relative;overflow:hidden;box-shadow:0 12px 30px #8059cf44}.hero h1{font-size:30px;line-height:1.1;margin:8px 0}.hero p{max-width:420px;line-height:1.5}.hero .emoji{font-size:62px;position:absolute;right:16px;bottom:8px;opacity:.9}.section{font-size:21px;font-weight:900;margin:25px 0 14px}.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.subject{border:0;text-align:left;padding:20px 16px;border-radius:23px;min-height:156px;box-shadow:0 6px 16px #5b3e8120;background:white;color:#34234f}.subject .symbol{font-size:37px}.subject b{display:block;margin:12px 0 4px;font-size:18px}.subject small{color:#72678a}.subject.ru{background:#ffebf2}.subject.math{background:#e4f4ff}.subject.world{background:#e6fae9}.subject.mix{background:#fff0d6}.card{background:#fff;border-radius:26px;padding:22px;box-shadow:0 8px 25px #72519b1b;margin-top:18px}.back{border:0;background:#fff;border-radius:15px;padding:10px 15px;color:#674ca0;font-weight:800}.lesson{display:flex;align-items:center;justify-content:space-between;gap:10px}.progress{height:12px;background:#f0eafa;border-radius:99px;overflow:hidden;margin:18px 0}.bar{height:100%;background:linear-gradient(90deg,#9c75ec,#ffae72);transition:width .3s}.question{font-size:25px;line-height:1.3;font-weight:900;margin:18px 0 22px}.story{background:#f7f1ff;border-radius:16px;padding:14px;line-height:1.5}.choices{display:grid;gap:11px}.choice{width:100%;background:#f9f6ff;border:2px solid #e9ddff;border-radius:17px;padding:15px;text-align:left;font-weight:750;color:#38254e}.choice.selected{border-color:#9268e4;background:#efe5ff}.answer{width:100%;padding:15px;border-radius:16px;border:2px solid #d8c6f4;outline:0;font-size:19px}.primary{width:100%;border:0;background:#8259d7;color:white;border-radius:17px;padding:16px;font-weight:900;font-size:17px;margin-top:18px;box-shadow:0 6px 0 #6240ad}.primary:active{transform:translateY(3px);box-shadow:0 3px 0 #6240ad}.primary:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;padding:14px;border-radius:15px;background:#e8f8eb;font-weight:700}.feedback.bad{background:#fff0e7}.hint{border:0;background:transparent;color:#7454bc;text-decoration:underline;padding:14px 0}.topic{width:100%;background:white;border:0;border-radius:18px;padding:17px;margin:8px 0;text-align:left;display:flex;justify-content:space-between;align-items:center;color:#34234f;box-shadow:0 3px 12px #65439d12}.topic b{font-size:17px}.topic small{display:block;color:#83758d;margin-top:5px}.result{text-align:center}.result .big{font-size:74px}.muted{color:#756b83}.speak{border:0;background:#f1e8ff;color:#6240ad;padding:15px 18px;border-radius:15px;font-weight:900}.footer{text-align:center;color:#847696;font-size:12px;margin-top:32px}@media(min-width:600px){.subjects{grid-template-columns:repeat(4,1fr)}.subject{min-height:175px}.hero{padding:32px}}@media(max-width:370px){.hero .emoji{opacity:.25}}
</style></head><body><main id="app"></main><script>

{name:'Орфограммы',emoji:'🔎',questions:[{q:'Вставь букву: тр_ва',options:['а','о','е','и'],answer:'а',hint:'Проверочное слово — травы.'},{q:'Вставь букву: гри_',options:['б','п','в','ф'],answer:'б',hint:'Проверочное слово — грибы.'},{q:'Как пишется правильно?',options:['чашка','чяшка','чашька','чяжка'],answer:'чашка'},{q:'Выбери слово с разделительным мягким знаком.',options:['вьюга','конь','день','мель'],answer:'вьюга'},{q:'Какое сочетание написано верно?',options:['жи-ши','жы-шы','ча-щя','чу-щю'],answer:'жи-ши'}]},

],

{name:'Считаем до 100',emoji:'➕',questions:[{q:'38 + 24 = ?',options:['62','52','64','61'],answer:'62'},{q:'73 − 28 = ?',options:['45','55','46','44'],answer:'45'},{q:'46 + 17 = ?',options:['63','53','64','62'],answer:'63'},{q:'90 − 36 = ?',options:['54','64','56','44'],answer:'54'},{q:'27 + 35 = ?',options:['62','52','72','61'],answer:'62'}]},
{name:'Задачи-приключения',emoji:'🐴',questions:[{q:'У Киры было 12 морковок. Она дала по 3 морковки двум пони. Сколько осталось?',options:['6','9','8','5'],answer:'6'},{q:'У замка 4 башни. На каждой по 2 флага. Сколько всего флагов?',options:['8','6','4','10'],answer:'8'},{q:'В конюшне 15 лошадей. 7 вышли гулять. Сколько осталось?',options:['8','7','9','6'],answer:'8'},{q:'На лугу 3 группы по 4 пони. Сколько пони всего?',options:['12','7','9','14'],answer:'12'},{q:'У щенка 20 косточек. Он спрятал 8, а потом ещё 5. Сколько не спрятал?',options:['7','13','8','5'],answer:'7'}]},
{name:'Величины и фигуры',emoji:'📐',questions:[{q:'Сколько сантиметров в 1 дециметре?',options:['10','100','5','20'],answer:'10'},{q:'Сколько минут в одном часе?',options:['60','30','100','24'],answer:'60'},{q:'Сколько углов у прямоугольника?',options:['4','3','5','6'],answer:'4'},{q:'Как называется фигура с тремя сторонами?',options:['треугольник','квадрат','круг','прямоугольник'],answer:'треугольник'},{q:'Что длиннее?',options:['1 метр','50 сантиметров','8 дециметров','90 сантиметров'],answer:'1 метр'}]}],
world:[{name:'Животные и растения',emoji:'🌿',questions:[{q:'Какое животное относится к млекопитающим?',options:['лошадь','щука','воробей','бабочка'],answer:'лошадь'},{q:'Что нужно растению для роста?',options:['свет, вода и воздух','только песок','только ветер','только камни'],answer:'свет, вода и воздух'},{q:'Какая птица обычно остаётся зимовать в средней полосе России?',options:['воробей','ласточка','стриж','кукушка'],answer:'воробей'},{q:'Какая часть растения впитывает воду из почвы?',options:['корень','цветок','плод','лист'],answer:'корень'},{q:'Как называют животных, которые питаются растениями?',options:['растительноядные','хищники','насекомые','земноводные'],answer:'растительноядные'}]},
{name:'Времена года и погода',emoji:'🌦️',questions:[{q:'Какой месяц идёт после сентября?',options:['октябрь','август','ноябрь','декабрь'],answer:'октябрь'},{q:'Что измеряют термометром?',options:['температуру','скорость ветра','длину дня','количество облаков'],answer:'температуру'},{q:'В какое время года обычно распускаются почки на деревьях?',options:['весной','зимой','осенью','в конце декабря'],answer:'весной'},{q:'Как называется вода, выпадающая из облаков в виде капель?',options:['дождь','туман','иней','роса'],answer:'дождь'},{q:'Сколько времён года?',options:['4','3','5','12'],answer:'4'}]},
{name:'Человек и безопасность',emoji:'🏡',questions:[{q:'Какой сигнал светофора разрешает пешеходу переходить дорогу?',options:['зелёный','красный','жёлтый','любой'],answer:'зелёный'},{q:'Что нужно сделать перед едой?',options:['вымыть руки','побегать','потрогать землю','открыть окно'],answer:'вымыть руки'},{q:'По какому номеру можно вызвать экстренные службы в России?',options:['112','1010','555','777'],answer:'112'},{q:'Что помогает сохранить зубы здоровыми?',options:['регулярная чистка зубов','много сладостей','редкая чистка','сон с конфетой'],answer:'регулярная чистка зубов'},{q:'Что делать, если почувствовал запах дыма и увидел пожар?',options:['позвать взрослого и выйти в безопасное место','спрятаться в шкаф','открыть все окна','продолжать играть'],answer:'позвать взрослого и выйти в безопасное место'}]}]};
const app=document.getElementById('app');let state={page:'home',subject:'ru',topic:0,questions:[],i:0,selected:'',checked:false,correct:0,attempts:0};let saved={};try{saved=JSON.parse(localStorage.getItem('academy_v1')||'{}')}catch{};const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={ru:'Русский язык',math:'Математика',world:'Окружающий мир',mix:'Случайный квест'};function total(){return Object.values(saved).reduce((a,b)=>a+(b.stars||0),0)}function header(){return `<div class="top"><div class="brand">🦄 Академия открытий</div><div class="pill">⭐ ${total()}</div></div>`}function home(){app.innerHTML=header()+`<section class="hero"><div style="font-weight:800;opacity:.9">✨ Привет, Кира!</div><h1>Магия начинается<br>с открытий!</h1><p>Помоги волшебным друзьям, решай загадки и собирай звёзды. Каждое задание — новое приключение!</p><div class="emoji">🐴🏰</div></section><div class="section">Выбери приключение</div><div class="subjects"><button class="subject ru" onclick="openSubject('ru')"><div class="symbol">📚</div><b>Русский язык</b><small>Слова и секреты</small></button><button class="subject math" onclick="openSubject('math')"><div class="symbol">🔢</div><b>Математика</b><small>Магия чисел</small></button><button class="subject world" onclick="openSubject('world')"><div class="symbol">🌿</div><b>Окружающий мир</b><small>Тайны природы</small></button><button class="subject mix" onclick="startMix()"><div class="symbol">🎲</div><b>Сюрприз-квест</b><small>Всё вперемешку</small></button></div><div class="card">🏆 <b>Твоя коллекция</b><p class="muted">За каждый правильный ответ ты получаешь звезду. Повторяй приключения и собирай ещё!</p><div style="font-size:32px">${'⭐'.repeat(Math.min(10,total()))||'🌟'}</div></div><div class="footer">Работает без интернета после сохранения файла • Прогресс хранится на устройстве</div>`}function openSubject(s){state.subject=s;state.page='topics';topics()}function topics(){let s=state.subject;app.innerHTML=header()+`<div style="margin-top:22px"><button class="back" onclick="home()">← Все миры</button></div><h1>${labels[s]}</h1><p class="muted">Выбирай тему. В каждом испытании пять заданий.</p>`+DB[s].map((t,i)=>`<button class="topic" onclick="start('${s}',${i})"><span><b>${t.emoji} ${t.name}</b><small>${t.questions.length} заданий · ${saved[s+'_'+i]?.stars||0} ⭐ собрано</small></span><span style="font-size:24px">›</span></button>`).join('')}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(s,i){state={page:'quiz',subject:s,topic:i,questions:shuffle(DB[s][i].questions).slice(0,5),i:0,selected:'',checked:false,correct:0,attempts:0};renderQ()}function startMix(){state={page:'quiz',subject:'mix',topic:0,questions:shuffle(Object.values(DB).flat().flatMap(t=>t.questions)).slice(0,10),i:0,selected:'',checked:false,correct:0,attempts:0};renderQ()}function speak(word){if(!('speechSynthesis'in window)){alert('Озвучивание недоступно в этом браузере');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='ru-RU';u.rate=.78;speechSynthesis.speak(u)}function renderQ(){let q=state.questions[state.i];if(!q)return finish();let isSpell=q.type==='spell';app.innerHTML=header()+`<div style="margin-top:22px"><button class="back" onclick="${state.subject==='mix'?'home()':'topics()'}">← Выйти</button></div><div class="card"><div class="lesson"><b>${state.subject==='mix'?'🎲 Сюрприз-квест':DB[state.subject][state.topic].emoji+' '+DB[state.subject][state.topic].name}</b><span class="pill">${state.i+1} / ${state.questions.length}</span></div><div class="progress"><div class="bar" style="width:${state.i/state.questions.length*100}%"></div></div><div class="story">🦄 Фея Луна приготовила испытание! Помоги ей найти правильный ответ.</div><div class="question">${escapeHTML(q.q)}</div>${isSpell?`<div style="text-align:center;margin:18px 0"><button class="speak" onclick="speak('${q.word}')">🔊 Послушать слово</button></div><input class="answer" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Напиши слово здесь" value="${escapeHTML(state.selected)}" oninput="state.selected=this.value" ${state.checked?'disabled':''}>`:`<div class="choices">${q.options.map((v,j)=>`<button class="choice ${state.selected===v?'selected':''}" onclick="choose(${j})" ${state.checked?'disabled':''}>${escapeHTML(v)}</button>`).join('')}</div>`}<button class="hint" onclick="showHint()">💡 Нужна подсказка?</button><div id="hint" class="muted" style="display:none">${escapeHTML(q.hint||'Подумай внимательно. Ты справишься!')}</div><div id="feedback">${state.checked?feedbackHTML(q):''}</div><button class="primary" onclick="${state.checked?'next()':'check()'}">${state.checked?(state.i===state.questions.length-1?'Посмотреть награды 🎉':'Дальше →'):'Проверить ответ ✨'}</button></div>`;if(isSpell&&!state.checked)document.getElementById('typed').focus()}
function choose(i){state.selected=state.questions[state.i].options[i];renderQ()}function showHint(){document.getElementById('hint').style.display='block'}function normalized(s){return String(s).trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ')}function right(q){return normalized(state.selected)===normalized(q.type==='spell'?q.word:q.answer)}function feedbackHTML(q){let ok=right(q);return `<div class="feedback ${ok?'':'bad'}">${ok?'🎉 Верно! Ты молодец!':'🌱 Почти! Правильный ответ: '+escapeHTML(q.type==='spell'?q.word:q.answer)}${!ok?'<div style="font-weight:400;margin-top:6px">Ошибки помогают учиться. Попробуй ещё в следующем приключении!</div>':''}</div>`}function check(){let q=state.questions[state.i];if(!state.selected.trim())return;state.checked=true;if(right(q))state.correct++;renderQ()}function next(){state.i++;state.selected='';state.checked=false;renderQ()}function finish(){let key=state.subject+'_'+state.topic;let previous=saved[key]?.stars||0;saved[key]={stars:Math.max(previous,state.correct),last:Date.now()};try{localStorage.setItem('academy_v1',JSON.stringify(saved))}catch{};app.innerHTML=header()+`<div class="card result"><div class="big">${state.correct===state.questions.length?'🏆':'🦄'}</div><h1>${state.correct===state.questions.length?'Волшебная победа!':'Приключение пройдено!'}</h1><p>Ты помогла друзьям и заработала</p><div style="font-size:40px">${'⭐'.repeat(state.correct)||'🌱'}</div><h2>${state.correct} из ${state.questions.length}</h2><p class="muted">${state.correct===state.questions.length?'Все ответы правильные!':'Можно пройти ещё раз и потренироваться.'}</p><button class="primary" onclick="${state.subject==='mix'?'startMix()':`start('${state.subject}',${state.topic})`}">Пройти ещё раз 🔄</button><button class="back" style="margin-top:20px" onclick="home()">На главную</button></div>`}home();
</script></body></html>
