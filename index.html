<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Академия приключений</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#e6dcff,#d7f5ed);font:18px system-ui;color:#30254e;min-height:100vh}main{max-width:720px;margin:auto;padding:24px}article{background:#fff;border-radius:28px;padding:25px;margin:14px 0;box-shadow:0 8px 25px #45317b15}button,input{font:inherit;border-radius:16px;padding:15px;border:1px solid #ddd}button{cursor:pointer;background:#eee7ff;color:#423079;text-align:left;width:100%;margin:5px 0;font-weight:600}button:hover{background:#ddd0ff}input{width:100%;margin:10px 0}h1{font-size:32px;line-height:1.1}h2{font-size:25px}.primary{background:#7050c8;color:white;text-align:center}.bar{height:10px;background:#eee;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#8b69df}small{color:#776a91}.emoji{font-size:64px}#feedback{min-height:28px;font-weight:600}</style><main id="app"></main><script>
const quests=[
['🦄','Тайна лунного единорога','Лунный свет исчез. Собери искры, чтобы вернуть единорогу магию.',[
['На поляне 24 белых цветка, а розовых на 13 больше. Сколько всего цветков?','61','Сначала найди количество розовых: 24 + 13.'],['Запиши слово на слух','берёза','Дерево с белым стволом.','audio'],['Какое слово однокоренное к слову «лес»?','лесник','Ищи общий корень.',['лесник','лестница','лесом']],['Вычисли: 73 − 38','35','Вычти сначала 30, затем 8.'],['Что обрабатывает информацию в компьютере?','процессор','Это устройство выполняет команды.',['монитор','процессор','флешка']],['2 дм 7 см — сколько сантиметров?','27','В одном дециметре 10 см.'],['Запиши слово на слух','сентябрь','Первый осенний месяц.','audio'],['Какой корень в слове «подводный»?','вод','Вода, водный.'],['В числе 86 сколько десятков и единиц?','8|6','Заполни два отдельных поля.','digits'],['Что является устройством вывода?','монитор','На нём появляется изображение.',['мышь','монитор','клавиатура']]]],
['🐶','Спасательная операция','Щенок потерялся. Найди следы и проведи его домой.',[
['У Рокки было 45 лакомств. Он съел 8, а потом получил ещё 16. Сколько стало?','53','45 − 8 + 16.'],['Запиши слово на слух','дорога','По ней идут или едут.','audio'],['Выбери форму слова «щенок».','щенком','Это то же слово, но в другой форме.',['щенком','щеночек','щенячий']],['Вычисли: 46 + 37','83','Прибавь 30, потом 7.'],['Какое устройство помогает вводить текст?','клавиатура','На ней есть буквы.',['принтер','клавиатура','монитор']],['3 м 2 дм — сколько дециметров?','32','В метре 10 дм.'],['Запиши слово на слух','вдруг','Означает неожиданно.','audio'],['Какой суффикс в слове «домик»?','ик','Корень дом.'],['В числе 57 сколько десятков и единиц?','5|7','Раздели число на разряды.','digits'],['Где хранится информация, пока компьютер выполняет программу?','оперативная память','Эта память временная.',['оперативная память','монитор','мышь']]]],
['🏰','Школа волшебства','Пройди уроки магии и получи диплом волшебника.',[
['В первой книге 36 заклинаний, во второй на 9 меньше. Сколько всего?','63','36 + (36 − 9).'],['Запиши слово на слух','алфавит','Буквы в определённом порядке.','audio'],['Какой антоним у слова «быстро»?','медленно','Противоположное значение.'],['Вычисли: 92 − 47','45','92 − 40 − 7.'],['Какое устройство управляет указателем на экране?','мышь','Её двигают рукой.',['мышь','принтер','колонки']],['1 м 15 см — сколько сантиметров?','115','В метре 100 см.'],['Запиши слово на слух','прощай','Так говорят при расставании.','audio'],['Найди приставку в слове «переписать».','пере','Корень пис.'],['В числе 94 сколько десятков и единиц?','9|4','Заполни оба поля.','digits'],['Что относится к внешней памяти?','флешка','На неё можно записать файлы.',['процессор','флешка','монитор']]]],
['🐴','Загадка королевской конюшни','Любимая лошадь принцессы исчезла. Расшифруй подсказки.',[
['В конюшне 28 лошадей и 17 пони. На прогулку ушли 19 животных. Сколько осталось?','26','28 + 17 − 19.'],['Запиши слово на слух','яблоко','Фрукт.','audio'],['Какое слово однокоренное к слову «мороз»?','морозный','Общий корень и смысл.',['морозный','морозом','море']],['Вычисли: 58 + 26','84','58 + 20 + 6.'],['Какое устройство печатает на бумаге?','принтер','Это устройство вывода.',['сканер','принтер','клавиатура']],['4 дм 3 см — сколько сантиметров?','43','4 дм = 40 см.'],['Запиши слово на слух','одежда','То, что мы надеваем.','audio'],['Какой корень в слове «садовый»?','сад','Сад, садик.'],['В числе 71 сколько десятков и единиц?','7|1','Заполни оба поля.','digits'],['Что сохраняет файлы после выключения компьютера?','жёсткий диск','Это долговременное хранение.',['оперативная память','жёсткий диск','процессор']]]],
['💎','Остров потерянных сокровищ','Собери десять частей карты и открой сундук.',[
['В сундуке 52 монеты. Нашли ещё 23, а 18 отдали друзьям. Сколько осталось?','57','52 + 23 − 18.'],['Запиши слово на слух','капуста','Овощ.','audio'],['Выбери синоним слова «весёлый».','радостный','Похожее значение.',['грустный','радостный','быстрый']],['Вычисли: 81 − 56','25','81 − 50 − 6.'],['Что относится к устройствам ввода?','сканер','Он передаёт изображение в компьютер.',['монитор','колонки','сканер']],['5 м — сколько дециметров?','50','Умножь на 10.'],['Запиши слово на слух','магазин','Место, где покупают товары.','audio'],['Какое окончание в слове «книги» (множественное число)?','и','Книга — книги.'],['В числе 63 сколько десятков и единиц?','6|3','Заполни оба поля.','digits'],['Что делает процессор?','обрабатывает информацию','Он выполняет команды.',['выводит изображение','обрабатывает информацию','печатает']]]]];
let progress={};try{progress=JSON.parse(localStorage.getItem('academy2')||'{}')}catch{}let q=0,n=0;const app=document.querySelector('#app');function save(){try{localStorage.setItem('academy2',JSON.stringify(progress))}catch{}}function home(){app.innerHTML='<small>2 класс · 5 приключений</small><h1>Академия волшебных приключений</h1><p>Выбери свою историю и собери все магические знаки!</p>'+quests.map((v,i)=>`<article><div class="emoji">${v[0]}</div><h2>${v[1]}</h2><p>${v[2]}</p><small>${progress[i]||0} из ${v[3].length} знаков</small><button class="primary" onclick="start(${i})">${progress[i]===10?'Пройти снова':'В приключение!'}</button></article>`).join('')}function start(i){q=i;n=progress[i]||0;if(n>=quests[i][3].length)n=0;render()}function render(){let v=quests[q],t=v[3][n];if(!t){app.innerHTML=`<article><div class="emoji">🏆</div><h1>Приключение завершено!</h1><p>Ты собрала все 10 магических знаков!</p><button class="primary" onclick="home()">К другим приключениям</button></article>`;return}app.innerHTML=`<button onclick="home()">← Карта приключений</button><article><small>${v[1]} · Знак ${n+1} из 10</small><div class="bar"><i style="width:${n*10}%"></i></div><div class="emoji">${v[0]}</div><h2>${t[0]}</h2><div id="answers"></div><p id="feedback" aria-live="polite"></p><button onclick="hint()">💡 Подсказка</button></article>`;let a=document.querySelector('#answers');if(Array.isArray(t[3])){t[3].forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>check(x);a.append(b)})}else{a.innerHTML=(t[3]==='audio'?'<button onclick="speak()">🔊 Прослушать слово</button>':'')+(t[3]==='digits'?'<label>Десятки<input id="ans" inputmode="numeric"></label><label>Единицы<input id="units" inputmode="numeric"></label>':'<input id="ans" autocomplete="off" placeholder="Твой ответ">')+'<button class="primary" onclick="submitAnswer()">Проверить</button>';a.onkeydown=e=>{if(e.key==='Enter')submitAnswer()}}}function speak(){if(!('speechSynthesis'in window)){document.querySelector('#feedback').textContent='Попроси взрослого прочитать слово по подсказке.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(quests[q][3][n][1]);u.lang='ru-RU';u.rate=.75;speechSynthesis.speak(u)}function hint(){document.querySelector('#feedback').textContent='💡 '+quests[q][3][n][2]}function submitAnswer(){let x=document.querySelector('#ans').value;if(document.querySelector('#units'))x=x.trim()+'|'+document.querySelector('#units').value.trim();check(x)}function norm(x){return x.normalize('NFKC').toLowerCase().replace(/ё/g,'е').trim()}function check(x){let t=quests[q][3][n];if(norm(x)===norm(t[1])){n++;progress[q]=n;save();document.querySelector('#answers').innerHTML='<h2>✨ Знак найден!</h2><button class="primary" onclick="render()">Дальше →</button>';document.querySelector('#feedback').textContent='Отлично!'}else document.querySelector('#feedback').textContent='Пока не получилось. Попробуй ещё раз!'}home();</script></html>
